[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "3riage"
version = "0.2.0"
description = "Contributor-first GitHub triage CLI and web dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.32.3",
    "python-dotenv>=1.0.1",
    "click>=8.1.7",
    "tabulate>=0.9.0",
    "flask>=3.0.0",
    "cryptography>=43.0.0",
]

[project.scripts]
3riage = "triage:cli"

[tool.hatch.build.targets.wheel]
only-include = [
    "triage.py",
    "core.py",
    "github_client.py",
    "app.py",
    "mock_data.py",
    "auth.py",
]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "threeriage_assets/templates"
"static" = "threeriage_assets/static"
